name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CHEZMOI_VERSION: 2.72.1
    steps:
      # サプライチェーン対策として、外部 Action の実行 SHA は .github/workflows/actions.lock で固定する。
      # workflow 側は可読な版タグを保ち、lockfile 未登録の参照は下の actions-lock job が失敗させる。
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends git jq zsh
          # 静的テストは workflow を YAML として構造で読むため、依存を明示的に固定する
          python3 -m pip install --disable-pip-version-check --quiet 'pyyaml==6.0.3'
          archive="chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          checksums="chezmoi_${CHEZMOI_VERSION}_checksums.txt"
          release="https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}"
          mkdir -p "$RUNNER_TEMP/chezmoi" "$RUNNER_TEMP/test-bin"
          cd "$RUNNER_TEMP/chezmoi"
          curl --fail --silent --show-error --location --retry 3 --remote-name "$release/$archive"
          curl --fail --silent --show-error --location --retry 3 --remote-name "$release/$checksums"
          awk -v archive="$archive" '$2 == archive' "$checksums" > checksum.txt
          test -s checksum.txt
          sha256sum --check checksum.txt
          tar -xzf "$archive" -C "$RUNNER_TEMP/test-bin" chezmoi
          echo "$RUNNER_TEMP/test-bin" >> "$GITHUB_PATH"
      - name: Verify test dependencies
        run: |
          python3 --version
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
          git --version
          jq --version
          chezmoi --version
          zsh --version
      - name: Run tests without skips
        run: |
          python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          if grep -Eq '^OK \(.*skipped=' "$RUNNER_TEMP/unittest.log"; then
            echo '::error::Tests were skipped; all existing tests must run in CI.'
            exit 1
          fi

  actions-lock:
    name: actions lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0
      - name: Verify lockfile
        run: gh actions-lock --verify
